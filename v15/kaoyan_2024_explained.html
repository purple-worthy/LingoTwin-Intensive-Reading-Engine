    {en:'Rutkowski is a Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes. He has made illustrations for games such as Sony\'s Horizon Forbidden West, Ubisoft\'s Anno, Dungeons & Dragons, and Magic: The Gathering. And he\'s become a sudden hit in the new world of text-to-image AI generation.',zh:'波兰数字艺术家 Rutkowski 擅古典奇幻风格，为多款游戏绘图，如今意外走红于文生图 AI 圈。'},
    {en:'His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion, which was launched late last month. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in "Wizard with sword and a glowing orb of magic fire fights a fierce dragon, Greg Rutkowski," and the system will produce something that looks not a million miles away from works in Rutkowski\'s style.',zh:'他的风格成了 Stable Diffusion 最常用提示词之一；输入其名字即可生成近似风格的作品。'},
    {en:'But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.',zh:'开源模型靠抓取网络图片训练，常未经许可、未署名 → 引发伦理与版权争议。'},
    {en:'According to the website Lexica, which tracks over 10 million images and prompts generated by Stable Diffusion, Rutkowski\'s name has been used as a prompt around 93,000 times. Some of the world\'s most famous artists, such as Michelangelo, Pablo Picasso, and Leonardo da Vinci, brought up around 2,000 prompts each or less. Rutkowski\'s name also features as a prompt thousands of times in the Discord of another text-to-image generator, Midjourney.',zh:'Lexica 数据：他的名字被用作提示词约 9.3 万次，远超米开朗基罗、毕加索、达芬奇（各约 2000 次）。'},
    {en:'Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn\'t his.',zh:'他起初以为是曝光机会，搜索后却发现大量冒名的非本人作品。'},
    {en:'"It\'s been just a month. What about in a year? I probably won\'t be able to find my work out there because [the internet] will be flooded with AI art," Rutkowski says. "That\'s concerning."',zh:'他担忧一年后自己的作品会被海量 AI 生成图淹没，难以辨认。'},
    {en:'"There is a coalition growing within artist industries to figure out how to tackle or mitigate this," says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.',zh:'艺术行业正形成联盟，可能推动新政策；建议用公共领域图像训练，并与博物馆、艺术家合作。'}
  ],
  questions:[
    {n:31,q:'What can be learned about Rutkowski from the first two paragraphs?',opts:['He is enthusiastic about using AI models','He is popular with users of an AI art generator','He attracts admiration from other illustrators','He specialises in classical painting digitalization']},
    {n:32,q:'The problem with open-source AI art generators is that they ___.',opts:['lack flexibility in responding to prompts','produce artworks in unpredictable styles','make unauthorized use of online images','collect user information without consent']},
    {n:33,q:'After searching online, Rutkowski found ___.',opts:['a unique way to reach audiences','a new method to identify AI images','AI-generated work bearing his name','heated disputes regarding his copyright']},
    {n:34,q:'According to Ortiz, AI companies are advised to ___.',opts:['campaign for new policies or regulation','offer their services to public institutions','strengthen their relationship with AI users','adopt a different strategy for AI model training']},
    {n:35,q:'What is the text mainly about?',opts:["Artists' responses to AI art generation","AI's expanded role in artistic creation",'Privacy issues in the application of AI','Opposing views on AI development']}
  ],
  insight:{
    thesis:'以 Rutkowski 名字被当作 AI 提示词为切口，讨论开源文生图工具的版权/伦理困境与行业应对。',
    outline:['①② 他是谁 + 风格成热门提示词（31 题细节）','③ 问题核心：抓取图像、未经许可与署名（32 题）','④ 9.3 万次 vs 2000 次 → 数据冲击','⑤⑥ 搜索发现冒名作品 → 担忧被淹没（33 题）','⑦ Ortiz：联盟、政策、公共领域训练、合作（34 题建议；35 题主旨）'],
    words:[['text-to-image','文生图'],['prompt','提示词'],['scrape','抓取'],['attribution','署名，归属'],['ethics and copyright','伦理与版权'],['coalition','联盟'],['mitigate','缓解'],['public domain','公共领域'],['forge partnerships','建立合作']],
    tips:['32 题定位第 3 段：without permission and proper attribution = unauthorized use。','34 题注意建议内容：用 public domain 训练是「换训练策略」，不是「推动政策」（那是联盟的事）。','35 题主旨要覆盖「艺术家如何回应」，不能只说 AI 发展。']
  }
},
{
  id:'t4', group:'Section II · Part A', label:'Text 4', cn:'湿地与最高法院', points:'', range:'36–40', kind:'reading',
  dir:'Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET.',
  passages:[
    {en:'The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction: the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.',zh:'切萨皮克湾的奇迹在于淡水与咸水交汇、水陆交融的复杂生态：栖息地、蓄洪、净水、防风暴潮。'},
    {en:'All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a "continuous surface connection to bodies of water." This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules. And it carries "significant repercussions for water quality and flood control throughout the United States," as Justice Brett Kavanaugh observed.',zh:'最高法院以 5:4 收窄 EPA 对湿地的监管权，开发商受益；大法官 Kavanaugh 警告对水质与防洪影响重大。'},
    {en:'In Maryland, the good news is that there are many state laws in place that provide wetlands protections. But that\'s a very shortsighted view, particularly when it comes to the Chesapeake Bay. The reality is that water, and the pollutants that so often come with it, don\'t respect state boundaries. The Chesapeake draws from a 64,000-square-mile watershed that extends into Virginia, Pennsylvania, New York, West Virginia, the District of Columbia and Delaware. Will those jurisdictions extend the same protections now denied under Sackett v. EPA? Perhaps some, but all? That seems unlikely.',zh:'马里兰州有保护法，但污染不认州界；6.4 万平方英里流域跨 6 州，其他州未必跟进。'},
    {en:'It is too easy, and misleading, to see such court rulings as merely standing up for the rights of landowners when the consequences can be so dire for their neighbours. And it\'s a reminder that the EPA\'s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighbouring states. Pennsylvania farmers, to use one telling example, aren\'t thinking about next year\'s blue crab harvest in Maryland when they decide whether to spread animal waste on their field, yet the runoff into nearby creeks can have enormous impact downstream.',zh:'把裁决说成维护地主权利是误导；宾州农民施肥的径流会影响下游马里兰的蓝蟹收成，凸显 EPA 跨州协调的必要。'},
    {en:'And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It\'s worth the scenic drive.',zh:'呼吁各州立法者重新审视湿地保护，并邀请他们实地考察 Blackwater 保护区——值得一游。'}
  ],
  questions:[
    {n:36,q:'The Chesapeake Bay is described in paragraph 1 as ___.',opts:['a valuable natural environment','a controversial conservation area','a place with commercial potential','a headache for nearby communities']},
    {n:37,q:"The U.S. Supreme Court's ruling in the Idaho case ___.",opts:['reinforces water pollution control','weakens the EPA\'s regulatory power','will end conflicts among local residents','may face opposition from mining operators']},
    {n:38,q:'How does the author feel about the future of the Chesapeake Bay?',opts:['worried','puzzled','relieved','encouraged']},
    {n:39,q:"What can be inferred about the EPA's involvement in the Chesapeake Bay Program?",opts:['It has restored the balance among neighbouring jurisdictions','It has triggered a radical reform in commercial fisheries','It has set a fine example of respecting state authorities','It has ensured the coordination of protection efforts']},
    {n:40,q:'The author holds that state lawmakers should ___.',opts:['be cautious about the influence of landowners','attach due importance to wetlands protections','recognize the need to expand wildlife refuges','improve the wellbeing of endangered species']}
  ],
  insight:{
    thesis:'借最高法院削弱 EPA 湿地监管权的裁决，论证湿地保护必须跨州协调、EPA 参与不可替代。',
    outline:['① 海湾生态价值 → 描述题（36 题）','② 5:4 裁决收窄监管权 → 细节题（37 题）','③ 州法不足：污染不认州界，流域跨 6 州 → 态度铺垫','④ 宾州农民径流影响下游 → 推断 EPA 作用（39 题）','⑤ 呼吁州立法者自查 → 作者建议（40 题）'],
    words:[['saline','含盐的'],['storm surge','风暴潮'],['continuous surface connection','连续地表连接'],['regulatory scope','监管范围'],['repercussion','负面影响，反响'],['watershed','流域'],['jurisdiction','管辖区域'],['deep-pocketed special interests','财力雄厚的利益集团'],['runoff','径流'],['teem with','充满']],
    tips:['38 题态度题：全文用 at risk / dire / shortsighted / unlikely 等词，基调是担忧而非释然。','39 题推断题：原文说 EPA 的参与对「超越邻近州利益集团影响」至关重要 → 落到「确保协调保护努力」。','40 题别被末段 wildlife refuge 细节带偏，call on … review their own wetlands protections 才是建议核心。']
  }
},
{
  id:'pb', group:'Section II · Part B', label:'Part B', cn:'新题型 · 观点匹配', points:'10 points', range:'41–45', kind:'matching',
  dir:'Choose the best statement from the list A-G for each numbered name (41-45). There are two extra choices which you do not need to use. Mark your answers on the ANSWER SHEET.',
  passages:[
    {en:'<b>41. Hannah</b> Simply there are people in Nigeria who cannot travel to the Smithsonian Institution to see that part of their history and culture represented by the Benin Bronzes. These should be available to them as part of their cultural heritage and history and as a source of national pride. There is no good reason that these artifacts should be beyond the ordinary reach of the educational objectives or inspiration of the generations to which they were left. They serve no purpose in a museum in the United States or elsewhere except as curious objects.',zh:'Hannah：尼日利亚人无法远赴史密森尼看贝宁青铜器；文物应作为文化遗产归还原处。'},
    {en:'<b>42. Buck</b> We know very exact reproductions of artwork can be and are regularly produced. Perhaps museums and governments might explore some role for the use of nearly exact reproductions as a means of resolving issues relating to returning works of art and antiquities. The context of any exhibit is more important to me than whether the object being displayed is 2000 years old or 2 months old. In many cases the experts have a hard time agreeing on what is the real object and what is a forgery. Again, the story an exhibit is trying to tell is what matters. The monetary value of the object on display is a distant second place in importance.',zh:'Buck：可用高仿复制品解决归还争议；展览讲述的故事比真品年代与价格更重要。'},
    {en:'<b>43. Sara</b> When visiting the Baltimore Museum of Art, I came across a magnificent 15th-century Chinese sculpture. It inspired me to learn more about the culture that it represented. Artifacts in museums have the power to inspire, and perhaps spark that need to learn and understand the nature of their creators. Having said that, I do feel that whatever artifacts find their way to public museums should, in fact, be sanctioned as having been obtained on loan, legally purchased or obtained by treaty. Stealing artifacts from other peoples\' cultures is obscene; it robs not only the physical objects, but the dignity and spirit of their creators.',zh:'Sara：文物能激发学习欲望，但进入博物馆的文物必须是借展、合法购买或条约取得；偷窃可耻。'},
    {en:'<b>44. Victor</b> Ancient art that is displayed in foreign countries by all means should be returned to the original country. The foreign countries have no right to hold back returning the items. I would ask that the foreign nations and the original country discuss the terms of transfer. Yes, there is the risk that the original will not have as good security as do the foreign countries. But look at what happened to Boston\'s Gardner Museum theft in 1990, including the loss of Rembrandt, Vermeer, Manet and other masterpieces. Nothing is absolutely safe nowhere, and now climate change agitators are attacking publicly displayed work in European museums.',zh:'Victor：文物必须归还；安全不是借口——连波士顿加德纳博物馆都曾失窃。'},
    {en:'<b>45. Julia</b> To those of you in the comments section who are having strong feelings about artifacts being removed from cities in the US and Britain and returned to their countries of origin, I would ask you to consider: why do you think Americans have more of a right to easily access the Benin Bronzes than people of Nigeria? Why are people who live within a day\'s drive of London entitled to go and see the Elgin Marbles whenever they want, but the people of Athens aren\'t? What intrinsic factors make the West a suitable home for these artifacts but preclude them from being preserved and displayed by their countries of origin? If your conclusion is that the West is better able to preserve these artifacts, think about why you\'re assuming that to be true.',zh:'Julia：用连环反问质疑「西方更擅长保管」这一前提，反驳反对归还的论证。'}
  ],
  options:[
    ['A','It is clear that the countries of origin have never been compensated for the stolen artifacts.'],
    ['B','It is a flawed line of reasoning to argue against returning artifacts to their countries of origin.'],
    ['C','Museum visitors can still learn as much from artifacts\' copies as from the originals.'],
    ['D','Reproductions, even if perfectly made, cannot take the place of the authentic object.'],
    ['E','The real value of artifacts can only be recognized in their countries of origin rather than anywhere else.'],
    ['F','Ways to get artifacts from other countries must be decent and lawful.'],
    ['G','Concern over security is no excuse for refusing to return artifacts to their countries of origin.']
  ],
  insight:{
    thesis:'围绕「贝宁青铜器/帕特农神庙雕塑是否应归还原属国」，五位发言人呈现五种立场，考观点与选项的语义匹配。',
    outline:['Hannah → 强调原属国民众的文化权利与自豪感（对应「真实价值只能在原属国被认识」）','Buck → 复制品足以承载展览故事（对应「复制品同样可学」）','Sara → 取得途径须合法正当（对应 F）','Victor → 安全担忧不能成为拒还借口（对应 G，用失窃案例佐证）','Julia → 连环反问拆穿反方推理缺陷（对应 B）'],
    words:[['artifact','文物，人工制品'],['reproduction','复制品'],['forgery','赝品'],['treaty','条约'],['obscene','可耻的'],['preclude','排除，阻止'],['intrinsic factor','内在因素']],
    tips:['先看选项中的「论断强度」：E 说 only，D 说 cannot take the place — 别把 Buck 的复制品立场错配给 D。','两个多余项常是「偷换概念」：A 的 compensated 原文无人提及。','段落主题句未必在首句：Victor 的 security 论据在中部，Julia 的答案靠全段反问归纳。']
  }
},
{
  id:'pc', group:'Section II · Part C', label:'Part C', cn:'翻译', points:'10 points', range:'46–50', kind:'translation',
  dir:'Read the following text carefully and then translate the underlined segments into Chinese. Write your answers on the ANSWER SHEET.',
  passages:[
    {en:'"Elephants never forget" — or so they say — and that piece of folklore seems to have some foundation. The African savanna elephants, also known as the African bush elephants, is distributed across 37 African countries. They move between a variety of habitats, including forests, grassland, woodlands, wetlands.',zh:'「大象永不忘记」这句俗语似乎有些依据。非洲草原象分布于 37 国，在森林、草原、林地、湿地等多种栖息地间迁移。'},
    {en:'<u class="u">(46) They sometimes travel more than sixty miles to find food or water, and are very good at working out where other elephants are — even when they are out of sight.</u> What is more, they almost always seem to choose the nearest waterhole.',zh:'它们有时为寻找食物或水行走 60 多英里，并极其擅长弄清其他大象的位置——即便看不见对方。'},
    {en:'<u class="u">(47) The researchers are convinced that the elephants always know precisely where they are in relation to all the resources they need, and can therefore take shortcuts, as well as following familiar routes.</u>',zh:'研究者确信，大象总能精确知道自己相对于所需资源的位置，因此既能走捷径，也能沿熟悉路线行进。'},
    {en:'Although the cues used by African elephants for long-distance navigation are not yet understood, smell may well play a part.',zh:'尽管大象远距离导航所用线索尚未明确，嗅觉很可能起作用。'},
    {en:'Elephants are very choosy eaters, but until recently little was known about how they selected their food. <u class="u">(48) One possibility was that they merely used their eyes and tried out the plants they found, but that would probably result in a lot of wasted time and energy, not least because their eyesight is actually not very good.</u>',zh:'一种可能是它们仅用眼睛、试吃找到的植物；但这会浪费大量时间与能量，尤其因为视力其实不太好。'},
    {en:'<u class="u">(49) The volatile chemicals produced by plants can be carried a long way, and they are very characteristic: each plant or tree has its own particular odor signature.</u> What is more, they can be detected even where they are not actually visible. New research suggests that smell is a crucial factor in guiding elephants — and probably other herbivores — to the best food resources.',zh:'植物释放的挥发性化学物质可传播很远且极具特征：每株植物或树都有独特气味签名；即便看不见也能被探测到。'},
    {en:'The researchers first established what kinds of plant the elephants preferred either to eat or avoid when foraging freely. They then set up a food station experiment, in which they gave the elephants a series of choices based only on smell. <u class="u">(50) The experiment showed that elephants may well use smell to identify patches of trees that are good to eat, and secondly to assess the quality of the trees within each patch.</u> Free-ranging elephants presumably also use this information to locate their preferred food.',zh:'实验显示，大象很可能先用嗅觉识别哪些树林可食，再评估每片树林中树木的质量。'},
    {en:'Their well-developed hippocampal structures may enable elephants, like rats and people, to construct cognitive maps.',zh:'发达的海马结构可能让大象像鼠和人一样构建认知地图。'}
  ],
  insight:{
    thesis:'说明大象的长距离导航与觅食能力，重点论证「嗅觉是关键线索」——五处划线句均为科普说明句。',
    outline:['46 并列句：travel … and are good at working out …；out of sight 处理为「看不见对方」','47 宾语从句 + 目的状语：be convinced that… / in relation to / take shortcuts','48 表语从句 + 让步：One possibility was that… / not least because','49 被动 + 冒号解释：can be carried / very characteristic / odor signature','50 宾语从句 + 并列目的：identify patches… and secondly assess…'],
    words:[['folklore','民间传说'],['habitat','栖息地'],['waterhole','水坑'],['navigation','导航'],['volatile chemicals','挥发性化学物质'],['odor signature','气味签名'],['herbivore','食草动物'],['hippocampal structure','海马结构'],['cognitive map','认知地图']],
    tips:['46 句的 work out 是「弄清楚」不是「锻炼」；out of sight 指其他大象不在视野内。','48 句 not least because = 「尤其因为」，别译成「不少因为」。','50 句 secondly 对应前面的 first，翻译时补出「首先……其次……」层次更清楚。']
  }
},

  id:'wb', group:'Section III · Writing', label:'Part B', cn:'图画作文 · 图表议论文', points:'20 points', range:'52', kind:'writing',

  passages:[
    {en:'Write your answer in 160-200 words on the ANSWER SHEET.',zh:'160–200 词；原卷此处配有一幅图画与一张图表（本页保留文字说明，图片见真题 PDF 第 14 页）。'},
    {en:'<b>写作框架提示：</b> 第一段描述图画与图表的关键信息；第二段阐释寓意（现象、原因、影响）；第三段给出评论与建议。',zh:'三段式：描述 → 释义 → 评论。'}

    outline:['第 1 段（约 50 词）：用 As is shown in the picture… 客观描述，别急着议论','第 2 段（约 90 词）：The picture conveys that… 点明寓意，再展开 2 个论证角度','第 3 段（约 40 词）：In my view… 给建议或展望'],
    words:[['depict','描绘'],['implied meaning','隐含意义'],['convey','传达'],['reflect','反映'],['phenomenon','现象'],['attach importance to','重视']],
    tips:['图表出现时务必写清「趋势/对比」，不能只复述图里的数字。','寓意段要有逻辑连接词：to begin with / moreover / therefore。','结尾避免喊口号，给一个具体、可操作的建议更稳。']
  }
}
];

/* ============================ 渲染 ============================ */
let idx = 0, showZh = false, insightCollapsed = false;
const $ = s => document.querySelector(s);

function buildNav(){
  const nav = $('#nav'); nav.innerHTML = '';
  let lastGroup = '';
  EXAM.forEach((c,i)=>{
    if(c.group !== lastGroup){ lastGroup=c.group; const g=document.createElement('div'); g.className='grp'; g.textContent=c.group; nav.appendChild(g); }
    const b=document.createElement('button'); b.className = i===idx?'active':'';
    b.innerHTML = `${c.label} <small>${c.cn} · ${c.range}${c.points?' · '+c.points:''}</small>`;
    b.onclick = ()=>go(i); nav.appendChild(b);
  });
}

function render(){
  const c = EXAM[idx];
  let h = `<div class="paper-head"><div class="sec">${c.group}</div>
    <h2>${c.label} · ${c.cn}</h2><div class="pts">${c.range} 题${c.points?' · '+c.points:''}</div></div>
    <div class="dir"><b>Directions:</b> ${c.dir}</div>`;

  c.passages.forEach((p,i)=>{
    h += `<div class="passage ${showZh?'zh-show':''}"><div class="en"><span class="n">${i+1}</span>${p.en}</div>
      <div class="zh"><span class="n">${i+1}</span>${p.zh}</div></div>`;
  });

  if(c.kind==='cloze'){
    h += `<div class="cloze-opts">` + c.options.map((o,i)=>
      `<div class="row"><b>${o[0]}.</b> <span>[A] ${o[1]}</span><span>[B] ${o[2]}</span><span>[C] ${o[3]}</span><span>[D] ${o[4]}</span></div>`
    ).join('') + `</div>`;
  }
  if(c.kind==='reading'){
    h += c.questions.map(q=>`<div class="q"><div class="qt"><span class="qn">${q.n}.</span>${q.q}</div>
      <div class="opts">${q.opts.map((o,i)=>`<div><b>[${'ABCD'[i]}]</b>${o}</div>`).join('')}</div></div>`).join('');
  }
  if(c.kind==='matching'){
    h += `<h3 style="margin-top:26px;font-size:16px">Options A–G</h3>` +
      c.options.map(o=>`<div class="q" style="margin:8px 0;padding:9px 14px"><b style="color:var(--gold)">[${o[0]}]</b> ${o[1]}</div>`).join('');
  }

  h += `<div class="insight ${insightCollapsed?'collapsed':''}" id="insight">
    <h3 onclick="toggleInsight()"><span>📖 中文解读 · ${c.cn}</span><span>${insightCollapsed?'展开 ▾':'收起 ▴'}</span></h3>
    <div class="body">
      <h4>一句话主旨</h4><div>${c.insight.thesis}</div>
      <h4>行文脉络</h4><ul>${c.insight.outline.map(x=>`<li>${x}</li>`).join('')}</ul>
      <h4>重点词汇</h4><div class="words">${c.insight.words.map(w=>`<span>${w[0]} · ${w[1]}</span>`).join('')}</div>
      <h4 class="tip">做题提示</h4><ul>${c.insight.tips.map(x=>`<li>${x}</li>`).join('')}</ul>
    </div></div>`;

  $('#stage').innerHTML = h;
  buildNav();
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){ idx=(i+EXAM.length)%EXAM.length; render(); }
function toggleZh(){ showZh=!showZh; render(); }
function toggleInsight(){ insightCollapsed=!insightCollapsed; const el=$('#insight'); if(el){el.classList.toggle('collapsed',insightCollapsed); el.querySelector('h3 span:last-child').textContent=insightCollapsed?'展开 ▾':'收起 ▴';} }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')go(idx-1); if(e.key==='ArrowRight')go(idx+1); });
render();
</script>
</body>
</html>
